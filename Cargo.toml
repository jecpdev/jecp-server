[package]
name = "jecp"
version = "1.1.1"
edition = "2021"
description = "JECP — Joint Execution & Commerce Protocol — reference Hub implementation"
license = "Apache-2.0"
repository = "https://github.com/jecpdev/jecp-server"
homepage = "https://jecp.dev"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "timeout", "request-id", "set-header", "catch-panic"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "uuid", "rust_decimal"] }
rust_decimal = { version = "1", features = ["db-postgres"] }

# HTTP client (Claude API, etc.)
#
# rustls-tls feature is opt-in per client (call .use_rustls_tls() or
# .use_preconfigured_tls() on the builder). Default-tls (native-tls) remains
# active for the rest of the codebase. This pairs with the direct `rustls`
# dep below to install a custom ServerCertVerifier for cert pinning on the
# facilitator client only (ADR-0005 / v1.1.1 H-1).
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
reqwest-eventsource = "0.6"

# v1.1.1 H-1: rustls direct dep for x402_cert_pin custom ServerCertVerifier
# (ADR-0005). Both crates are already in the dep tree transitively via sqlx
# (sqlx-postgres → rustls 0.23.36 / webpki-roots 0.26.11) — adding them as
# direct deps brings ZERO new transitive crates and ZERO binary size delta.
# rustls dangerous_configuration: required to install a custom verifier on
# top of WebPkiServerVerifier (chain validation) + SPKI pin check.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "1.0"
# subtle: constant-time SPKI pin compare. Already in dep tree via bcrypt /
# ed25519-dalek / curve25519-dalek — zero new transitives.
subtle = "2"

# Auth
ed25519-dalek = { version = "2", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
bcrypt = "0.16"
hex = "0.4"

# PDF generation
genpdf = "0.2"
printpdf = "0.7"

# Image processing
image = "0.25"

# CSV / data
csv = "1"

# Utilities
http-body-util = "0.1"
parking_lot = "0.12"
# v1.0.1: replay cache (Provenance v2 nonce LRU per spec §5.2 step 5).
# 0.16+: GHSA-rhfx-m35p-ff5j (IterMut Stacked Borrows soundness fix).
lru = "0.16"
# v1.0.2 K2.5: action input_schema validation against published manifest.
# default-features = false drops the optional reqwest dep (we only validate
# against in-memory schemas — never fetch remote $refs over HTTP).
jsonschema = { version = "0.18", default-features = false, features = ["draft202012"] }
# v1.1.0 Phase 1 c6: SSRF defense — URL parse + IP deny-list CIDR matching.
url       = "2"
ipnet     = "2"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
thiserror = "2"
anyhow = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
futures = "0.3"
tokio-stream = "0.1"
bytes = "1"
rand = "0.8"
async-stream = "0.3"

# v1.1.0 x402: USDC-on-Base payment path on /v1/invoke (locked-design §5.4)
# - alloy-primitives: Address / B256 / U256 wire types only (no signing, no providers).
#   ~250 KB stripped; pure-Rust; no transitive bloat. Wraps existing primitives
#   we'd otherwise hand-roll (checksum address parsing + 32-byte hex handling).
# - sha3: keccak256 for capabilityId derivation (Am-6 lazy-on-promote).
#   ~80 KB stripped; pure-Rust; lighter than alloy-sol-types for our needs
#   (we only need the hash, not full ABI encoding).
# Total binary impact: ~330 KB; zero new transitive risk surfaces.
#
# v1.1.1 H-3: AWS KMS Ethereum signer for the RELAYER role
# (locked-design Am-5; splitter-panel-integration §4).
#
# Rationale:
# - aws-sdk-kms / aws-config: KMS Sign + GetPublicKey for the relayer key.
#   `default-https-client` selects aws-smithy-http-client/rustls-aws-lc, which
#   pulls modern rustls 0.23 + rustls-webpki 0.103 + hyper 1.x. The older
#   `rustls` feature on these crates activates `aws-smithy-runtime/tls-rustls`,
#   which is the legacy hyper-014 + rustls-0.21 + rustls-webpki-0.101 path
#   and is the sole reason Dependabot #12/#4/#3 stay open. Do NOT add `rustls`
#   back. sqlx in tree already runs on rustls 0.23 (ring), so there is no
#   pinning conflict; the AWS path uses aws-lc-rs which coexists with ring.
# - alloy-rlp: minimal EIP-1559 transaction RLP encoder (~100 KB).
# - k256: secp256k1 ECDSA pubkey recovery for y-parity (~500 KB; pure Rust).
#
# Total binary delta ~5-7 MB stripped (mostly aws-smithy transitive).
# Backward compat: the AwsKmsRelayerSigner is opt-in via JECP_RELAYER_KMS_KEY_ID;
# if unset, AppState wires StubRelayerSigner exactly as before (zero behavior
# change for existing deploys).
alloy-primitives = { version = "0.8", features = ["serde"] }
sha3 = "0.10"
async-trait = "0.1"
aws-sdk-kms = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-config  = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
alloy-rlp   = "0.3"
k256        = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic", "std"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
axum-test = "16"
regex = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
